<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Fit2Trade form definition</title></head>
  <body>
    <!-- Static form definition used by Netlify's deploy-time form detection. -->
    <form name="fit2trade-demo" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="fit2trade-demo">
      <input name="bot-field">
      <input name="first-name">
      <input name="last-name">
      <input type="email" name="email">
      <input name="organisation">
      <select name="locations"><option>1</option></select>
      <select name="employees"><option>1–50</option></select>
      <select name="priority"><option>Not sure yet</option></select>
      <textarea name="message"></textarea>
      <input type="checkbox" name="privacy-consent" value="agreed">
    </form>
    <form name="early-years-access" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="early-years-access">
      <input name="bot-field">
      <input name="first-name">
      <input name="last-name">
      <input type="email" name="email">
      <input name="setting">
      <select name="position"><option>Owner</option></select>
      <select name="employees"><option>1–5</option></select>
      <textarea name="message"></textarea>
      <input type="checkbox" name="privacy-consent" value="agreed">
    </form>
  </body>
</html>
